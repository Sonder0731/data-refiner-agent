[project]
name = "data-refiner-user-workspace"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0.2,<7.0.0",
    "pyspark==3.5.2",
    "data-refiner-pyspark==1.0.0",
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
    "hdfs>=2.7.3",
    "loguru>=0.7.3",
    "packaging>=24",
    "conda-pack==0.9.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling","editables", "uv>=0.1.0"]
build-backend = "hatchling.build"
  [tool.hatch.build.targets.wheel]
  only-include = [
      "workspace"
  ]

[tool.hatch.build.targets.sdist]
include = ["workspace"]

[project.scripts]
doc-checker = "doc_checker:run"
