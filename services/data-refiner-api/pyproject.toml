[project]
name = "data-refiner-api"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0.2,<7.0.0",
    "pyspark==3.5.2",
    "data-refiner-pyspark==1.0.0",
    "fastapi>=0.140.0",
    "packaging>=24",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "uvicorn>=0.51.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
