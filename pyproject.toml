[project]
name = "data-refiner-agent"
version = "0.0.1"
description = "LangGraph workflow with pipeline and operator-building agents"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "deepagents>=0.6.3",
    "httpx>=0.28.1",
    "langchain>=1.3.1",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "packaging>=24",
    "psycopg[binary]==3.3.4",
    "pydantic>=2.12.0",
    "pyyaml>=6",
]

[project.scripts]
data-refiner-agent = "data_refiner_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_refiner_agent", "src/data_refiner_agent_tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
